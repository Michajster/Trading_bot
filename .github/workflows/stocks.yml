name: Ceny akcji

on:
  schedule:
    # co 15 minut w dni robocze, 6:00–21:59 UTC (obejmuje sesje GPW i USA)
    - cron: "*/15 6-21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stocks.yml"
      - "scripts/fetch_stocks.py"

permissions:
  contents: write

concurrency:
  group: stocks
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: mkdir -p out && python scripts/fetch_stocks.py out/stocks.json
      - name: Opublikuj na gałęzi data (jeden commit, bez puchnięcia repo)
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.json
          git commit -q -m "Ceny akcji $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
